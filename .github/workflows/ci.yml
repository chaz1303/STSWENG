# CI plan (docs/CI_Plane.pdf §4, §8). Phases 1–6 are live; Phase 7 remains a stub for later deployment.
name: mang-juan-user-ci

on:
  push:
    branches: [develop, main, 'feature/**', 'fix/**', 'release/**']
  pull_request:
    branches: [develop, main]
  schedule:
    - cron: '0 18 * * *' # 02:00 Asia/Manila
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Phase 1 (setup) runs at the start of every job: checkout, Node from .nvmrc, npm ci.

  lint: # Phase 2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run lint

  audit: # Phase 2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm audit --audit-level=high

  # contract: # Phase 2. Compare src/utils/contract.js with Team 2's definitions once they publish them.
  # runs on: ubuntu-latest
  # steps: ...

  build: # Phase 3
    needs: [lint, audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run build
      # TODO: bundle size budget check (CI plan §4.4) once a budget is set.
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  unit: # Phase 4
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npx vitest run tests/unit --coverage

  integration: # Phase 5
    needs: unit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: user_side
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: mang_juan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://user_side:testpassword@localhost:5432/mang_juan_test # edit DATABASE_URL
      JWT_SECRET: integration-test-secret # edit JWT_SECRET
      PORT: 3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - name: Apply DB Schema
        run: |
          PGPASSWORD=testpassword psql -h localhost -U user_side -d mang_juan_test -f db/schema.sql
      - name: Run Integration Tests
        run: npx vitest run tests/integration

  e2e: # Phase 6
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: npm }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - run: pip install -r requirements.txt
      - name: Run E2E Tests
        run: npm run test:e2e
      - name: Upload E2E Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: reports/e2e/

  # deploy-staging:if: develop or release/*. Host undecided.
  # deploy-production: if: main; environment: production (manual approval).
